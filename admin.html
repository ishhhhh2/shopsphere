
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopSphere | Admin Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <header>
        <nav aria-label="Main navigation">

            <a href="index.html" class="logo">
                ShopSphere
            </a>

            <div class="nav-links">
                <a href="products.html">Products</a>
                <a href="wishlist.html">Wishlist</a>
                <a href="cart.html">Cart</a>
                <a href="login.html">Login</a>
            </div>

        </nav>
    </header>

    <main>

        <section class="featured-section">

            <h1>Admin Dashboard</h1>

            <p>
                Manage the ShopSphere product catalog.
            </p>

            <section aria-labelledby="add-product-title">

                <h2 id="add-product-title">
                    Add a New Product
                </h2>

                <form id="product-form">

                    <div>
                        <label for="product-name">
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="product-name"
                            required
                            minlength="2"
                        >
                    </div>

                    <div>
                        <label for="product-price">
                            Price ($)
                        </label>

                        <input
                            type="number"
                            id="product-price"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>

                    <div>
                        <label for="product-category">
                            Category
                        </label>

                        <input
                            type="text"
                            id="product-category"
                            required
                        >
                    </div>

                    <div>
                        <label for="product-image">
                            Image URL
                        </label>

                        <input
                            type="url"
                            id="product-image"
                            placeholder="https://example.com/image.jpg"
                        >
                    </div>

                    <button type="submit" class="button">
                        Add Product
                    </button>

                    <p id="admin-message" role="status"></p>

                </form>

            </section>

            <section aria-labelledby="manage-products-title">

                <h2 id="manage-products-title">
                    Manage Products
                </h2>

                <div id="admin-products">
                    <!-- Admin product list will appear here -->
                </div>

            </section>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 ShopSphere. All rights reserved.</p>
    </footer>

    <script type="module" src="js/admin.js"></script>

</body>

</html>
